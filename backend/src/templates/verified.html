<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Email verified — Smith Net</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    body { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #f6f8fa; color: #1f2328; margin: 0; padding: 48px 24px; line-height: 1.5; }
    .card { max-width: 520px; margin: 0 auto; background: #ffffff; border: 1px solid #d1d9e0; border-radius: 6px; padding: 32px; }
    h1 { font-size: 18px; margin: 0 0 16px; letter-spacing: 0.5px; }
    p { margin: 0 0 12px; }
    .ok { color: #1f883d; font-weight: 600; }
    .small { color: #59636e; font-size: 13px; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>EMAIL VERIFIED</h1>
    <p class="ok">Your email is confirmed.</p>
    <p>You can return to the Smith Net app — the verification banner will clear on your next request.</p>
    <p class="small">If the banner persists, force-close and reopen the app, or pull down to refresh.</p>
  </div>
</body>
</html>
