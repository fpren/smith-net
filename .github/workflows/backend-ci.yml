name: backend CI

on:
  push:
    branches: [master, main]
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smith
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: smithnet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smith -d smithnet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgres://smith:ci-test-password@localhost:5432/smithnet
      SMITH_RELAY_URL: ws://localhost:3000
      PGPASSWORD: ci-test-password
      # Shared by the relay bootstrap and the integration tests (WS test logs in
      # as the bootstrapped admin to obtain a JWT for the authenticated upgrade).
      DEFAULT_ADMIN_PASSWORD: ci-test-admin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript build
        run: npm run build

      - name: Apply schema migrations
        run: |
          # Relay base tables (messages/presence/message_bus_messages) have no
          # migration file — they are hand-created on the Hetzner server. Recreate
          # them here. NOTE: channels is deliberately NOT defined here; migration
          # 007 owns it (created_at TIMESTAMPTZ). The 'general' channel is created
          # by the app at runtime, not seeded, so it carries a valid mesh_hash.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TABLE IF NOT EXISTS messages (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), channel_id TEXT NOT NULL DEFAULT 'general', sender_id TEXT NOT NULL, sender_name TEXT NOT NULL, content TEXT NOT NULL, timestamp BIGINT NOT NULL DEFAULT (EXTRACT(EPOCH FROM NOW()) * 1000)::BIGINT, is_mesh_origin BOOLEAN DEFAULT FALSE, origin TEXT DEFAULT 'online', media_type TEXT, media_url TEXT, is_deleted BOOLEAN DEFAULT FALSE, created_at TIMESTAMPTZ DEFAULT NOW());
          CREATE TABLE IF NOT EXISTS presence (user_id TEXT PRIMARY KEY, user_name TEXT NOT NULL, last_seen BIGINT NOT NULL DEFAULT (EXTRACT(EPOCH FROM NOW()) * 1000)::BIGINT, status TEXT DEFAULT 'online', updated_at TIMESTAMPTZ DEFAULT NOW());
          CREATE TABLE IF NOT EXISTS message_bus_messages (id UUID PRIMARY KEY DEFAULT gen_random_uuid(), channel_id TEXT NOT NULL, sender_id TEXT NOT NULL, sender_name TEXT NOT NULL, content TEXT NOT NULL, timestamp BIGINT NOT NULL, vector_clock JSONB NOT NULL DEFAULT '{}'::jsonb, transport_type TEXT NOT NULL DEFAULT 'ip', media_type TEXT DEFAULT 'TEXT', media_url TEXT, ai_generated BOOLEAN DEFAULT FALSE, ai_model TEXT, synced_at TIMESTAMPTZ DEFAULT NOW());
          SQL
          # Apply every migration in numeric order (002..NNN). ON_ERROR_STOP so a
          # bad migration fails the build instead of silently drifting.
          for f in $(ls migrations/*.sql | sort -V); do
            echo "applying $(basename "$f")"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Start relay in background
        env:
          PORT: '3000'
          DEFAULT_ADMIN_PASSWORD: ci-test-admin
        run: |
          node dist/server.js &
          echo "$!" > /tmp/relay.pid
          for i in {1..30}; do
            if curl -fsS http://localhost:3000/api/health > /dev/null; then break; fi
            sleep 1
          done

      - name: Run integration tests
        run: node --test tests/relay.integration.test.js tests/services.integration.test.js

      - name: Stop relay
        if: always()
        run: kill "$(cat /tmp/relay.pid)" 2>/dev/null || true
