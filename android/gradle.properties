# Gradle 8.2 requires JDK 17 (Temurin). Newer JDKs (e.g. 25) crash the daemon.
# Local dev on this Mac: export JAVA_HOME=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home

# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-download=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Use Android Studio's bundled JDK
# org.gradle.java.home=C:\\Program Files\\Android\\Android Studio\\jbr
# Using system Java for macOS build
