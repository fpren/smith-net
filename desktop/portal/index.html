<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SMITH NET</title>
    <script>try{var t=localStorage.getItem('sn-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: Inter, system-ui, sans-serif;
        background: #F7F8FA;
        color: #1C2128;
      }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) body { background: #14171C; color: #E9ECF1; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
